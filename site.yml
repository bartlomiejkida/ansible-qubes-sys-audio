---
- name: Download template if not exists (it may take up to several minutes)
  hosts: dom0
  become: true
  tasks:
    - name: Download template if not exists (it may take up to several minutes)
      ansible.builtin.command:
        cmd: qvm-template install {{ base_template }}
        creates: /var/lib/qubes/vm-templates/{{ base_template }}
      changed_when: true

- name: Clone template
  hosts: dom0
  become: true
  tasks:
    - name: Copy template to {{ templatevm_sys_audio }}
      ansible.builtin.command:
        cmd: qvm-clone {{ base_template }} {{ templatevm_sys_audio }}
        creates: /var/lib/qubes/vm-templates/{{ templatevm_sys_audio }}
      changed_when: true

- name: Start templatevm
  hosts: dom0
  become: true
  tasks:
    - name: Start templatevm
      ansible.builtin.command: qvm-start --wait {{ templatevm_sys_audio }}
      changed_when: true

- name: Prepare templatevm for qubes-ansible management
  hosts: dom0
  become: true
  tasks:
    - name: Allow templatevm to be used as disposable (mgmt DVM) template
      ansible.builtin.command:
        cmd: qvm-prefs {{ templatevm_sys_audio }} template_for_dispvms True
      changed_when: true

    - name: Point management_dispvm of templatevm to itself
      ansible.builtin.command:
        cmd: qvm-prefs {{ templatevm_sys_audio }} management_dispvm {{ templatevm_sys_audio }}
      changed_when: true

    - name: Install qubes-ansible-vm in templatevm (Debian)
      when: base_template is search('debian')
      ansible.builtin.command:
        cmd: >-
          qvm-run --pass-io --user root {{ templatevm_sys_audio }}
          'apt-get update && apt-get install -y qubes-ansible-vm'
      changed_when: true

    - name: Install qubes-ansible-vm in templatevm (Fedora)
      when: base_template is search('fedora')
      ansible.builtin.command:
        cmd: >-
          qvm-run --pass-io --user root {{ templatevm_sys_audio }}
          'dnf install -y qubes-ansible-vm'
      changed_when: true

- name: Configure TemplateVM sys-audio
  hosts: templatevms
  become: true
  roles:
    - role: templatevm
      tags: templatevm

- name: Shutdown templatevm
  hosts: dom0
  become: true
  tasks:
    - name: Shutdown templatevm
      ansible.builtin.command: qvm-shutdown --wait {{ templatevm_sys_audio }}
      changed_when: true

- name: Create AppVM
  become: true
  hosts: dom0
  tasks:
    - name: Create AppVM {{ appvm_sys_audio }}
      ansible.builtin.command:
        cmd: >
          qvm-create
            --label {{ appvm_label }}
            --template {{ templatevm_sys_audio }}
            --class AppVM
            --property netvm=
            --property memory={{ appvm_maxmemory }}
            --property maxmem=0
            --property vcpus={{ appvm_vcpus }}
            --property autostart=True
            --property virt_mode=hvm
            {{ appvm_sys_audio }}
        creates: /var/lib/qubes/appvms/{{ appvm_sys_audio }}
      changed_when: true

- name: Prepare AppVM for qubes-ansible management
  hosts: dom0
  become: true
  tasks:
    - name: Point management_dispvm of AppVM to sys-audio template
      ansible.builtin.command:
        cmd: qvm-prefs {{ appvm_sys_audio }} management_dispvm {{ templatevm_sys_audio }}
      changed_when: true

- name: Start AppVM
  hosts: dom0
  become: true
  tasks:
    - name: Start AppVM {{ appvm_sys_audio }}
      ansible.builtin.command: qvm-start --wait {{ appvm_sys_audio }}
      changed_when: true

- name: Configure AppVM sys-audio
  hosts: appvms
  roles:
    - role: appvm
      tags: appvm

- name: Shutdown AppVM
  hosts: dom0
  become: true
  tasks:
    - name: Shutdown AppVM {{ appvm_sys_audio }}
      ansible.builtin.command: qvm-shutdown --wait {{ appvm_sys_audio }}
      changed_when: true

- name: Configure dom0
  hosts: dom0
  become: true
  roles:
    - role: dom0
      tags: dom0
