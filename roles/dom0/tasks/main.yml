---
- name: Install {{ dom0_packages }} on dom0
  become: true
  ansible.builtin.command:
    cmd: qubes-dom0-update -y {{ dom0_packages | join(' ') }}
  changed_when: true

- name: Add audiovm-sys-audio tag to {{ appvm_sys_audio }}
  ansible.builtin.command:
    cmd: >
      qvm-tags
        {{ appvm_sys_audio }}
        add
        {{ appvm_sys_audio_tag }}
  changed_when: true

- name: Add audiovm service to sys-audio AppVM
  ansible.builtin.command:
    cmd: >
      qvm-service
      {{ appvm_sys_audio }}
      audiovm on
  changed_when: true

- name: Set sys-audio as default audio device
  ansible.builtin.command:
    cmd: >
      qubes-prefs
        default_audiovm
        {{ appvm_sys_audio }}
  changed_when: true

- name: Define default apps for menu-items
  ansible.builtin.command:
    cmd: >
      qvm-features
        {{ appvm_sys_audio }}
        menu-items
          "{{ appvm_menu_items }}"
  changed_when: true

# Attaches all unattached PCI audio devices (persistent, with no-strict-reset
# so the device keeps working). Idempotent: qvm-pci list shows only
# unattached devices, so already attached ones are not re-attached.
# The AppVM is stopped at this point (see site.yml), so the attach is clean.
- name: Attach PCI audio devices to {{ appvm_sys_audio }}
  when: enable_pci_auto_attach | bool
  ansible.builtin.shell:
    cmd: |
      devices="$(qvm-pci list | grep -i audio | awk '{print $1}')"
      if [ -z "$devices" ]; then
        echo "no unattached PCI audio devices"
      else
        for device in $devices; do
          qvm-pci attach "{{ appvm_sys_audio }}" "$device" --persistent -o no-strict-reset=True
          echo "attached $device to {{ appvm_sys_audio }}"
        done
      fi
  register: pci_audio_devices
  changed_when: "'no unattached PCI audio devices' not in pci_audio_devices.stdout"

  # TODO: Add USB device to sys-audio

- name: Add 81-sys-audio.policy to /etc/qubes/policy.d/81-sys-audio.policy
  become: true
  ansible.builtin.template:
    src: files/etc/qubes/policy.d/81-sys-audio.policy.j2
    dest: /etc/qubes/policy.d/81-sys-audio.policy
    mode: '0644'
    owner: root
    group: root

  # If you want to use the USB device in sys-audio, you need to add workaround
  # to start sys-usb AppVM when sys-audio is started
  # Based on https://forum.qubes-os.org/t/unable-to-get-sys-audio-qube-to-auto-start-on-boot/25957/22
- name: Add libxl hook
  when: enable_usb_auto_attach | bool
  block:
    - name: Create /etc/libvirt/hooks directory
      become: true
      ansible.builtin.file:
        path: /etc/libvirt/hooks
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Add /etc/libvirt/hooks/libxl file
      become: true
      ansible.builtin.template:
        src: files/etc/libvirt/hooks/libxl.j2
        dest: /etc/libvirt/hooks/libxl
        mode: '0755'
        owner: root
        group: root

- name: Disable audio for sys VMs
  ansible.builtin.command:
    cmd: "qvm-prefs {{ item }} audiovm ''"
  loop: "{{ sys_vms_no_audio }}"
  changed_when: true
